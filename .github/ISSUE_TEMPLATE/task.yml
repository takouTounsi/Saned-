name: Governance or architecture task
description: Focused documentation, DevOps, or architecture proposal task.
title: "[TASK] "
labels: ["type:task"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context and problem
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective and deliverable
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and validation
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Architecture, security, and privacy impact

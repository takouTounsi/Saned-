name: Bug report
description: Report observed behavior in an existing artifact.
title: "[BUG] "
labels: ["type:bug"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context and problem
      description: Artifact, version, observed result, and expected result; no personal data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic examples only.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and validation
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Dependencies and architecture, security, and privacy impacts

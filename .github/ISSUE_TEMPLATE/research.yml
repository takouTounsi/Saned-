name: Research
description: Investigate a question without assuming the outcome.
title: "[RESEARCH] "
labels: ["type:research"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context and research question
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective and deliverable
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources, dependencies, and alternatives
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and validation method
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Architecture, security, and privacy impact

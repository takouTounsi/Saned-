name: Recherche
description: Étudier une question sans présumer de la décision.
title: "[RESEARCH] "
labels: ["type:research"]
body:
  - type: textarea
    id: context
    attributes:
      label: Contexte et question
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objectif et livrable
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Périmètre et exclusions
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources, dépendances et alternatives
  - type: textarea
    id: acceptance
    attributes:
      label: Critères d'acceptation et méthode de validation
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact architecture, sécurité et vie privée

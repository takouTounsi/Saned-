name: Proposed feature
description: Proposal for validation, not an approved requirement.
title: "[PROPOSAL] "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: "Do not create a product implementation ticket without explicit authorization."
  - type: textarea
    id: context
    attributes:
      label: Context and problem
      description: Why does this proposal exist?
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective and validation source
      description: Expected outcome and who or what can validate it.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and open questions
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and validation
      description: Measurable criteria and verification method.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Architecture, security, and privacy impact
      description: Write TBD if unknown.
